services:
  - type: web
    name: northstar-python-api
    runtime: python
    plan: free
    buildCommand: pip install -e ".[api,pdf,openai,anthropic]"
    startCommand: uvicorn financial_analyst.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
